on:
  schedule:
    - cron: '0 12 * * 1'  # 12:00 UTC every Monday
  workflow_dispatch:

name: Free space on runners

jobs:
  self_hosted_pi_4_1:
    name: Free space on Pi4-1
    runs-on: self-hosted-pi4-1
    steps:
      - uses: actions/setup-node@v3
        with:
          node-version-file: .node-version
      - run: npm cache verify
      - run: npm cache clean --force
      - run: npm cache verify

  self_hosted_pi_4_2:
    name: Free space on Pi4-2
    runs-on: self-hosted-pi4-2
    steps:
      - uses: actions/setup-node@v3
        with:
          node-version-file: .node-version
      - run: npm cache verify
      - run: npm cache clean --force
      - run: npm cache verify

  self_hosted_pi_4_3:
    name: Free space on Pi4-3
    runs-on: self-hosted-pi4-3
    steps:
      - uses: actions/setup-node@v3
        with:
          node-version-file: .node-version
      - run: npm cache verify
      - run: npm cache clean --force
      - run: npm cache verify
