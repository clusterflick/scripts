on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: >-
      contains(github.event.comment.body, '@claude review titles') &&
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: false
          claude_args: >-
            --dangerously-skip-permissions
            --max-turns 15
            --disallowedTools Task,WebFetch,WebSearch,Glob,Grep,TodoWrite,ToolSearch
          prompt: |
            In this branch we've had some automated updates to `common/tests/test-titles.json`.
            Use git show HEAD to identify the newly added entries, then confirm those changes are correct,
            or fix them if they're not.
            There's details on how this setup works in `docs/reviewing-title-normalisation-test-cases.md`
            For each new entry: run the normalizer on the input, and check the output matches what's
            in the JSON. If it matches, accept it — do not investigate further whether the output
            is "ideally" correct. Only investigate and fix cases where the recorded output does NOT
            match what the normalizer currently produces.
            If a case is ambiguous, accept the current output rather than investigating further.
